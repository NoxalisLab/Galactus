[package]
name = "galactus-app"
version = "0.1.8"
description = "Galactus, local MoE assistant by Noxalis Lab"
edition = "2021"
# Two binaries live in this crate (the app and the galactus CLI); tauri
# needs to know which one is the app.
default-run = "galactus-app"

[lib]
name = "galactus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true

[[bin]]
name = "galactus"
path = "src/bin/galactus.rs"

# The three headless drivers below prove the workspace engine, the snapshot
# walk and the Python analysis without launching the app. They are NOT part of
# the product: cargo auto-discovers anything in src/bin/, and tauri-bundler
# copies every binary of the crate into Galactus.app/Contents/MacOS, so without
# `required-features` they would ship to users as dead weight.
#
#   cargo test --features devtools --bin gx-workspace
#   cargo run  --features devtools --bin gx-snapshot -- --json .
[features]
devtools = []

[[bin]]
name = "gx-workspace"
path = "src/bin/gx-workspace.rs"
required-features = ["devtools"]

[[bin]]
name = "gx-snapshot"
path = "src/bin/gx-snapshot.rs"
required-features = ["devtools"]

[[bin]]
name = "gx-pylang"
path = "src/bin/gx-pylang.rs"
required-features = ["devtools"]

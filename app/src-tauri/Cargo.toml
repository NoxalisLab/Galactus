[package]
name = "galactus-app"
version = "0.1.15"
description = "Galactus, local MoE assistant by Noxalis Lab"
edition = "2021"
# Two binaries live in this crate (the app and the galactus CLI); tauri
# needs to know which one is the app.
default-run = "galactus-app"

[lib]
name = "galactus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon is a FEATURE of a crate that is already here, not a new
# dependency: tray-icon and muda were already in Cargo.lock as part of tauri's
# own tree. Server mode needs it, because the red button hides the window
# rather than destroying it (the webview holds the agent loop), and an app that
# is running with no window and no menu bar item is an app nobody can find.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The two halves of "install the next version without a download page".
#
# tauri-plugin-updater does the whole transaction on the Rust side: it fetches
# the manifest, verifies the minisign signature of the archive against the
# public key baked into tauri.conf.json, unpacks it over the installed bundle.
# Nothing of that crosses the webview, so the app's content policy is untouched
# and a compromised page cannot ask for an install of its own.
#
# tauri-plugin-process exists for exactly one call, `restart`. Replacing the
# bundle on disk does not replace the process that is running from it, so an
# update that is not followed by a relaunch is an update that appears to have
# done nothing. That call has ONE caller in the whole app, behind a button,
# and the reason is in the frontend comment: this process may be running
# scheduled jobs with nobody in front of it.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
strip = true
lto = true

[[bin]]
name = "galactus"
path = "src/bin/galactus.rs"

# The three headless drivers below prove the workspace engine, the snapshot
# walk and the Python analysis without launching the app. They are NOT part of
# the product: cargo auto-discovers anything in src/bin/, and tauri-bundler
# copies every binary of the crate into Galactus.app/Contents/MacOS, so without
# `required-features` they would ship to users as dead weight.
#
#   cargo test --features devtools --bin gx-workspace
#   cargo run  --features devtools --bin gx-snapshot -- --json .
[features]
devtools = []

[[bin]]
name = "gx-workspace"
path = "src/bin/gx-workspace.rs"
required-features = ["devtools"]

[[bin]]
name = "gx-snapshot"
path = "src/bin/gx-snapshot.rs"
required-features = ["devtools"]

[[bin]]
name = "gx-pylang"
path = "src/bin/gx-pylang.rs"
required-features = ["devtools"]

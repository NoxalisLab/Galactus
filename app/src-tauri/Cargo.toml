[package]
name = "galactus-app"
version = "0.1.0"
description = "Galactus — local MoE assistant by Noxalis Lab"
edition = "2021"

[lib]
name = "galactus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true

[package]
name = "galactus-app"
version = "0.1.1"
description = "Galactus — local MoE assistant by Noxalis Lab"
edition = "2021"
# Two binaries live in this crate (the app and the galactus CLI); tauri
# needs to know which one is the app.
default-run = "galactus-app"

[lib]
name = "galactus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true

[[bin]]
name = "galactus"
path = "src/bin/galactus.rs"
